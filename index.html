
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiragana-harjoittelu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
      color: #222;
    }

    h1 { font-size: 28px; }

    select, button {
      padding: 12px;
      margin: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .kana {
      font-size: 100px;
      margin: 25px 0;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }

    .answers button {
      background: white;
      border: 1px solid #aaa;
      border-radius: 8px;
    }

    button:hover { background: #e5e5e5; }

    #feedback {
      min-height: 28px;
      font-weight: bold;
    }

    #next {
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Hiragana-harjoittelu</h1>
  <p>Valitse oikea romaji-vastine hiragana-merkille.</p>

  <label for="level">Harjoittelutaso:</label>
  <select id="level" onchange="resetGame()">
    <option value="basic">Perusmerkit</option>
    <option value="all">Kaikki perusmerkit</option>
  </select>

  <div class="kana" id="kana">あ</div>

  <div class="answers" id="answers"></div>

  <p id="feedback" aria-live="polite"></p>
  <p>Oikein: <span id="score">0</span></p>
  <p>Kysymyksiä: <span id="total">0</span></p>

  <button id="next" onclick="nextQuestion()">Seuraava kysymys</button>

  <script>
    const basic = [
      ["あ","a"], ["い","i"], ["う","u"], ["え","e"], ["お","o"],
      ["か","ka"], ["き","ki"], ["く","ku"], ["け","ke"], ["こ","ko"],
      ["さ","sa"], ["し","shi"], ["す","su"], ["せ","se"], ["そ","so"],
      ["た","ta"], ["ち","chi"], ["つ","tsu"], ["て","te"], ["と","to"],
      ["な","na"], ["に","ni"], ["ぬ","nu"], ["ね","ne"], ["の","no"],
      ["は","ha"], ["ひ","hi"], ["ふ","fu"], ["へ","he"], ["ほ","ho"],
      ["ま","ma"], ["み","mi"], ["む","mu"], ["め","me"], ["も","mo"],
      ["や","ya"], ["ゆ","yu"], ["よ","yo"],
      ["ら","ra"], ["り","ri"], ["る","ru"], ["れ","re"], ["ろ","ro"],
      ["わ","wa"], ["を","wo"], ["ん","n"]
    ];

    let current;
    let score = 0;
    let total = 0;
    let answered = false;

    function getCharacters() {
      return basic;
    }

    function resetGame() {
      score = 0;
      total = 0;
      document.getElementById("score").textContent = score;
      document.getElementById("total").textContent = total;
      nextQuestion();
    }

    function nextQuestion() {
      answered = false;
      document.getElementById("feedback").textContent = "";

      const chars = getCharacters();
      current = chars[Math.floor(Math.random() * chars.length)];

      document.getElementById("kana").textContent = current[0];

      let options = [current[1]];

      while (options.length < 4) {
        const random = chars[Math.floor(Math.random() * chars.length)][1];
        if (!options.includes(random)) options.push(random);
      }

      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById("answers");
      container.innerHTML = "";

      options.forEach(option => {
        const button = document.createElement("button");
        button.textContent = option;
        button.onclick = () => checkAnswer(option);
        container.appendChild(button);
      });
    }

    function checkAnswer(answer) {
      if (answered) return;
      answered = true;
      total++;

      if (answer === current[1]) {
        score++;
        document.getElementById("feedback").textContent = "Oikein!";
      } else {
        document.getElementById("feedback").textContent =
          "Väärin! Oikea vastaus on " + current[1] + ".";
      }

      document.getElementById("score").textContent = score;
      document.getElementById("total").textContent = total;
    }

    nextQuestion();
  </script>
</body>
</html>
